<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login • StudyVault (Private 3-Friend Space)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z'/><path d='M6 6h10'/><path d='M6 10h10'/><rect width='6' height='5' x='11' y='14' rx='1'/><path d='M14 14v-2a1 1 0 0 0-2 0v2'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Glow effect -->
  <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-500/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="relative w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
    
    <!-- Security Header -->
    <div class="text-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25 mx-auto mb-4">
        <i data-lucide="shield-check" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">StudyVault</h1>
      <p class="text-xs text-slate-400 mt-1 max-w-xs mx-auto">
        Private document-sharing space restricted exclusively to the 3 authorized study group friends.
      </p>

      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[11px] font-semibold mt-3">
        <i data-lucide="lock" class="w-3 h-3"></i>
        <span>Encrypted & Whitelist Protected</span>
      </div>
    </div>

    <!-- Alert container -->
    <div id="alertBox" class="hidden mb-4 p-3.5 rounded-2xl bg-rose-950/50 border border-rose-900 text-rose-400 text-xs flex items-start gap-2.5">
      <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
      <div id="alertMsg"></div>
    </div>

    <!-- 1. Quick Select: The 3 Authorized Friends -->
    <div id="quickSelectView">
      <div class="flex items-center justify-between mb-3 text-xs font-semibold text-slate-300">
        <span class="flex items-center gap-1.5">
          <i data-lucide="users" class="w-3.5 h-3.5 text-indigo-400"></i>
          Select Your Authorized Account
        </span>
        <span class="text-slate-500 text-[11px]">3 Friends</span>
      </div>

      <div class="space-y-2.5">
        {% for friend in friends %}
        <button
          onclick="loginAs('{{ friend.email }}')"
          class="w-full flex items-center justify-between p-3.5 rounded-2xl border border-slate-800 hover:border-indigo-500 bg-slate-800/40 hover:bg-indigo-950/30 transition-all group text-left"
        >
          <div class="flex items-center gap-3">
            <img src="{{ friend.avatar }}" alt="{{ friend.name }}" class="w-10 h-10 rounded-full object-cover ring-2 ring-indigo-500/20 group-hover:ring-indigo-500">
            <div>
              <p class="font-semibold text-sm text-white group-hover:text-indigo-400 transition-colors">
                {{ friend.name }}
              </p>
              <p class="text-xs text-slate-400 font-mono">
                {{ friend.email }}
              </p>
            </div>
          </div>
          <i data-lucide="arrow-right" class="w-4 h-4 text-slate-500 group-hover:text-indigo-400 transition-transform group-hover:translate-x-0.5"></i>
        </button>
        {% endfor %}
      </div>

      <div class="mt-5 text-center">
        <button onclick="toggleMode(true)" class="text-xs text-indigo-400 hover:underline font-medium">
          Sign in by typing email address instead
        </button>
      </div>
    </div>

    <!-- 2. Manual Email Input View -->
    <div id="emailInputView" class="hidden">
      <form onsubmit="handleEmailLogin(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-slate-300 mb-1">
            Authorized Gmail Address
          </label>
          <input
            id="emailInput"
            type="email"
            placeholder="friend@studyvault.org"
            required
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
          <p class="text-[11px] text-slate-400 mt-1">
            Must be one of the 3 authorized study group accounts
          </p>
        </div>

        <button
          type="submit"
          class="w-full py-2.5 rounded-xl font-semibold bg-indigo-600 hover:bg-indigo-700 text-white shadow-md shadow-indigo-500/20 text-xs transition-all"
        >
          Sign In
        </button>

        <div class="text-center pt-2">
          <button type="button" onclick="toggleMode(false)" class="text-slate-400 hover:text-slate-200 underline">
            Back to 3 Friends selector
          </button>
        </div>
      </form>
    </div>

  </div>

  <script>
    lucide.createIcons();

    function toggleMode(isEmail) {
      document.getElementById('quickSelectView').classList.toggle('hidden', isEmail);
      document.getElementById('emailInputView').classList.toggle('hidden', !isEmail);
      document.getElementById('alertBox').classList.add('hidden');
    }

    async function loginAs(email) {
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/';
        } else {
          showAlert(data.error || 'Access Denied');
        }
      } catch (err) {
        showAlert('Network error during login');
      }
    }

    function handleEmailLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      loginAs(email);
    }

    function showAlert(msg) {
      const box = document.getElementById('alertBox');
      document.getElementById('alertMsg').textContent = msg;
      box.classList.remove('hidden');
      lucide.createIcons();
    }
  </script>
</body>
</html>
